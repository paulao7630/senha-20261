<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Gerador de Senhas</h1>
        </div>

        <!-- Área de exibição da senha -->
        <div class="display-box">
            <span id="password">xK9#mP2$vL1@</span>
            <button class="copy-btn" type="button" title="Copiar">Copiar</button>
        </div>

        <!-- Painel de personalização -->
        <div class="custom-section">
            <h2>Personalize sua senha</h2>

            <div class="control-group">
                <span class="control-label">Número de caracteres</span>
                
                <div class="counter">
                    <button type="button">-</button>
                    <span id="lengthVal">12</span>
                    <button type="button">+</button>
                </div>
            </div>

            <button class="generate-btn" type="button">Gerar Nova Senha</button>
        </div>
    </div>

</body>
</html>
