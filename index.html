<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Gerador de Senhas</h1>
        </div>

        <!-- Área onde a senha gerada é exibida -->
        <div class="display-box">
            <span id="password">Senha</span>
            <button class="copy-btn" id="copyBtn" title="Copiar">Copiar</button>
        </div>

        <!-- Opções e controles do gerador -->
        <div class="custom-section">
            <h2>Personalize sua senha</h2>

            <div class="control-group">
                <span class="control-label">Número de caracteres</span>
                
                <div class="counter">
                    <button id="decrement" type="button">-</button>
                    <span id="lengthVal">12</span>
                    <button id="increment" type="button">+</button>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn" type="button">Gerar Nova Senha</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
